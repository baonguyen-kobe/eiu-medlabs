name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:
    inputs:
      e2e_mode:
        default: required
        required: false
        type: string

concurrency:
  group: ci-supabase-runtime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.impact.outputs.lane }}
      node_tests: ${{ steps.impact.outputs.node_tests }}
      reason: ${{ steps.impact.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Classify changed files and determine CI lane
        id: impact
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ci-impact.mjs \
            --event "$CI_EVENT_NAME" \
            --base "$CI_BASE_SHA" \
            --head "$CI_HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  verify:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.e2e_mode == 'full' && 90 || 30 }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use lockfile npm version
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (CI contract)
        if: ${{ needs.plan.outputs.lane == 'ci_contract_only' }}
        run: npm run format:check

      - name: Run CI contract tests
        if: ${{ needs.plan.outputs.lane == 'ci_contract_only' }}
        run: |
          node --test \
            tests/ci-supabase-isolation-workflow.test.mjs \
            tests/supabase-sql-line-ending-contract.test.mjs

      - name: Check formatting on changed Node tests
        if: ${{ needs.plan.outputs.lane == 'node_test_only' }}
        env:
          NODE_TEST_PATHS: ${{ needs.plan.outputs.node_tests }}
        run: npx prettier --check --ignore-unknown $NODE_TEST_PATHS

      - name: Lint changed Node tests
        if: ${{ needs.plan.outputs.lane == 'node_test_only' }}
        env:
          NODE_TEST_PATHS: ${{ needs.plan.outputs.node_tests }}
        run: npx eslint $NODE_TEST_PATHS

      - name: Run changed Node tests
        if: ${{ needs.plan.outputs.lane == 'node_test_only' }}
        env:
          NODE_TEST_PATHS: ${{ needs.plan.outputs.node_tests }}
        run: node --test $NODE_TEST_PATHS

      - name: Check formatting
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npm run format:check

      - name: Audit dependencies
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npm audit

      - name: Retire stale CI Supabase runtime
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        shell: bash
        run: |
          npx --no-install supabase stop --project-id lich-truc-app-ci --no-backup || true

      - name: Prepare isolated CI Supabase workdir
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        shell: bash
        run: |
          CI_SUPABASE_WORKDIR="$(mktemp -d "$RUNNER_TEMP/lich-truc-app-ci.XXXXXX")"
          node scripts/prepare-ci-supabase-workdir.mjs "$CI_SUPABASE_WORKDIR"
          {
            echo "CI_SUPABASE_WORKDIR=$CI_SUPABASE_WORKDIR"
            echo "SUPABASE_LOCAL_PROJECT_ID=lich-truc-app-ci"
            echo "Y05_DB_CONTAINER=supabase_db_lich-truc-app-ci"
          } >> "$GITHUB_ENV"

      - name: Start isolated CI Supabase
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npx --no-install supabase start --workdir "$CI_SUPABASE_WORKDIR"

      - name: Reset schema from migrations
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npx --no-install supabase db reset --workdir "$CI_SUPABASE_WORKDIR"

      - name: Create local test environment
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        shell: bash
        run: |
          eval "$(npx --no-install supabase status --workdir "$CI_SUPABASE_WORKDIR" -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "LOCAL_SMTP_URL=$INBUCKET_URL"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
            echo "EMAIL_DELIVERY_MODE=off"
          } > .env.local

      - name: Seed isolated test users and fixtures
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        shell: pwsh
        run: ./scripts/seed-local-users.ps1 -SupabaseWorkdir "$env:CI_SUPABASE_WORKDIR"

      - name: Lint database
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npx --no-install supabase db lint --workdir "$CI_SUPABASE_WORKDIR" --local --level error

      - name: Lint application
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npm run typecheck

      - name: Run unit and database tests
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npm test

      - name: Run database history tests
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npx --no-install supabase test db --workdir "$CI_SUPABASE_WORKDIR"

      - name: Restore E2E fixtures after database tests
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        shell: pwsh
        run: ./scripts/seed-local-users.ps1 -SupabaseWorkdir "$env:CI_SUPABASE_WORKDIR"

      - name: Install Chromium for end-to-end tests
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npx playwright install chromium

      - name: Run required stable end-to-end suite
        if: ${{ needs.plan.outputs.lane == 'broad' && inputs.e2e_mode != 'full' }}
        run: npm run test:e2e:required

      - name: Run full local end-to-end suite
        if: ${{ needs.plan.outputs.lane == 'broad' && inputs.e2e_mode == 'full' }}
        run: npm run test:e2e:full-local

      - name: Verify Basic Medical evidence flag-off behavior
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npm run test:e2e:evidence-off

      - name: Build production bundle
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npm run build

      - name: Smoke-test production bundle
        if: ${{ needs.plan.outputs.lane == 'broad' }}
        run: npm run test:e2e:production-smoke:run

      - name: Upload Full E2E failure artifacts
        if: ${{ failure() && needs.plan.outputs.lane == 'broad' && inputs.e2e_mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-playwright-artifacts-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up isolated CI Supabase runtime
        if: ${{ always() && needs.plan.outputs.lane == 'broad' }}
        shell: bash
        run: |
          npx --no-install supabase stop --project-id lich-truc-app-ci --no-backup || true
          if [[ -n "${CI_SUPABASE_WORKDIR:-}" && -d "$CI_SUPABASE_WORKDIR" ]]; then
            case "$CI_SUPABASE_WORKDIR" in
              "$RUNNER_TEMP"/lich-truc-app-ci.*)
                rm -rf -- "$CI_SUPABASE_WORKDIR"
                ;;
              *)
                echo "Refusing to remove a non-CI Supabase workdir: $CI_SUPABASE_WORKDIR" >&2
                exit 1
                ;;
            esac
          fi
