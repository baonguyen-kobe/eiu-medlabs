name: Personnel Production Auth Alignment 2026-08-11

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow ref
        uses: actions/checkout@v4

      - name: Verify required alignment secrets and production project
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
          PRODUCTION_ADMIN_IDENTIFIER: ${{ secrets.PRODUCTION_ADMIN_IDENTIFIER }}
          PRODUCTION_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
          PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER: ${{ secrets.PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER }}
          PRODUCTION_PERSONNEL_MANAGER_PASSWORD: ${{ secrets.PRODUCTION_PERSONNEL_MANAGER_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for variable in \
            PRODUCTION_SUPABASE_URL \
            PRODUCTION_SUPABASE_SECRET_KEY \
            PRODUCTION_ADMIN_IDENTIFIER \
            PRODUCTION_ADMIN_PASSWORD \
            PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER \
            PRODUCTION_PERSONNEL_MANAGER_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              missing+=("$variable")
            fi
          done
          if ((${#missing[@]})); then
            printf '::error::Missing required GitHub Actions secret(s): %s\\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$PRODUCTION_SUPABASE_URL" != "https://bwhiivfhezoozrzvchmm.supabase.co" ]]; then
            printf '%s\\n' '::error::PRODUCTION_SUPABASE_URL does not match the approved production project.' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate identities and align approved Auth passwords
        env:
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_SUPABASE_SECRET_KEY: ${{ secrets.PRODUCTION_SUPABASE_SECRET_KEY }}
          PRODUCTION_ADMIN_IDENTIFIER: ${{ secrets.PRODUCTION_ADMIN_IDENTIFIER }}
          PRODUCTION_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
          PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER: ${{ secrets.PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER }}
          PRODUCTION_PERSONNEL_MANAGER_PASSWORD: ${{ secrets.PRODUCTION_PERSONNEL_MANAGER_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from "@supabase/supabase-js";

          const approvedProjectUrl = "https://bwhiivfhezoozrzvchmm.supabase.co";
          const approvedRootIdentifier = "admin@medlabs.local";
          const approvedManagerIdentifier = "bao.nguyen@eiu.edu.vn";
          const productionUrl = process.env.PRODUCTION_SUPABASE_URL;
          const productionSecretKey = process.env.PRODUCTION_SUPABASE_SECRET_KEY;
          const rootIdentifier = process.env.PRODUCTION_ADMIN_IDENTIFIER?.trim().toLowerCase();
          const rootPassword = process.env.PRODUCTION_ADMIN_PASSWORD;
          const managerIdentifier = process.env.PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER
            ?.trim()
            .toLowerCase();
          const managerPassword = process.env.PRODUCTION_PERSONNEL_MANAGER_PASSWORD;

          const required = [
            ["PRODUCTION_SUPABASE_URL", productionUrl],
            ["PRODUCTION_SUPABASE_SECRET_KEY", productionSecretKey],
            ["PRODUCTION_ADMIN_IDENTIFIER", rootIdentifier],
            ["PRODUCTION_ADMIN_PASSWORD", rootPassword],
            ["PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER", managerIdentifier],
            ["PRODUCTION_PERSONNEL_MANAGER_PASSWORD", managerPassword],
          ];
          const missing = required
            .filter(([, value]) => !value)
            .map(([name]) => name);
          if (missing.length) {
            throw new Error(`Missing required environment variable(s): ${missing.join(", ")}`);
          }
          if (productionUrl !== approvedProjectUrl) {
            throw new Error("Production project pin validation failed.");
          }
          if (rootIdentifier !== approvedRootIdentifier) {
            throw new Error("Root Administrator identifier is not the approved account.");
          }
          if (managerIdentifier !== approvedManagerIdentifier) {
            throw new Error("Personnel Manager identifier is not the approved account.");
          }

          const supabase = createClient(productionUrl, productionSecretKey, {
            auth: { autoRefreshToken: false, persistSession: false },
          });

          function assertCheck(label, check, passed) {
            console.log(`${label}: ${check} ${passed ? "YES" : "NO"}`);
            if (!passed) {
              throw new Error(`${label}: ${check} validation failed.`);
            }
          }

          async function findExactlyOneAuthUser(identifier, label) {
            const matches = [];
            const perPage = 1_000;
            for (let page = 1; page <= 1_000; page += 1) {
              const { data, error } = await supabase.auth.admin.listUsers({
                page,
                perPage,
              });
              if (error) {
                throw new Error(`${label}: Auth user lookup failed.`);
              }
              const users = data?.users ?? [];
              matches.push(
                ...users.filter(
                  (user) => user.email?.trim().toLowerCase() === identifier,
                ),
              );
              if (users.length < perPage) break;
            }
            assertCheck(label, "Auth user exists", matches.length === 1);
            return matches[0];
          }

          async function loadProfileAndAdminRole(user, identifier, label) {
            const { data: profiles, error: profileError } = await supabase
              .from("profiles")
              .select("id,email,is_active")
              .eq("id", user.id);
            if (profileError) {
              throw new Error(`${label}: profile validation query failed.`);
            }
            const profile = profiles?.[0];
            assertCheck(
              label,
              "profile identity match",
              profiles?.length === 1 &&
                profile?.email?.trim().toLowerCase() === identifier,
            );
            assertCheck(label, "active", profile?.is_active === true);

            const { data: adminRole, error: roleError } = await supabase
              .from("user_roles")
              .select("role")
              .eq("user_id", user.id)
              .eq("role", "admin")
              .maybeSingle();
            if (roleError) {
              throw new Error(`${label}: Admin role validation query failed.`);
            }
            assertCheck(label, "Admin role match", adminRole?.role === "admin");
          }

          const [rootUser, managerUser] = await Promise.all([
            findExactlyOneAuthUser(rootIdentifier, "Root Administrator"),
            findExactlyOneAuthUser(managerIdentifier, "Personnel Manager"),
          ]);
          assertCheck(
            "Approved personas",
            "distinct Auth users",
            rootUser.id !== managerUser.id,
          );

          const { data: principals, error: principalsError } = await supabase
            .from("system_security_principals")
            .select("root_admin_id,personnel_manager_id")
            .eq("singleton", true);
          if (principalsError) {
            throw new Error("Security principal validation query failed.");
          }
          assertCheck("Security principals", "singleton exists", principals?.length === 1);
          const principal = principals[0];
          assertCheck(
            "Root Administrator",
            "principal match",
            principal.root_admin_id === rootUser.id,
          );
          assertCheck(
            "Personnel Manager",
            "principal match",
            principal.personnel_manager_id === managerUser.id,
          );

          await Promise.all([
            loadProfileAndAdminRole(rootUser, rootIdentifier, "Root Administrator"),
            loadProfileAndAdminRole(
              managerUser,
              managerIdentifier,
              "Personnel Manager",
            ),
          ]);

          const personas = [
            {
              label: "Root Administrator",
              userId: rootUser.id,
              password: rootPassword,
            },
            {
              label: "Personnel Manager",
              userId: managerUser.id,
              password: managerPassword,
            },
          ];
          const aligned = [];
          for (const persona of personas) {
            const { error } = await supabase.auth.admin.updateUserById(
              persona.userId,
              { password: persona.password },
            );
            if (error) {
              console.error(
                `${persona.label}: password alignment FAILED; previously aligned: ${aligned.join(", ") || "none"}.`,
              );
              throw new Error(`${persona.label}: password alignment failed.`);
            }
            aligned.push(persona.label);
            console.log(`${persona.label}: password aligned YES.`);
          }
          console.log("Password alignment completed for both approved personas.");
          NODE
