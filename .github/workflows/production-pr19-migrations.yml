name: Production PR #19 migrations

on:
  workflow_dispatch:

concurrency:
  group: production-pr19-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply reviewed PR #19 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: bwhiivfhezoozrzvchmm
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install the locked Supabase CLI
        run: npm ci --ignore-scripts

      - name: Verify release identity and reviewed migration files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "RELEASE_IDENTITY_CHANGED: production migrations may run only from main."
            exit 1
          fi

          readonly expected_files=(
            "20260811230000_require_active_inventory_targets.sql"
            "20260812000000_fix_basic_medical_cancellation_time_boundary.sql"
            "20260812010000_guard_basic_medical_confirmation_inventory_snapshot.sql"
            "20260812022922_add_basic_medical_confirmation_evidence.sql"
            "20260812030000_snapshot_basic_medical_condition_log_catalog.sql"
          )
          readonly expected_blob_hashes=(
            "76e7cfc0cee323cee98724bd292fc4084457d383"
            "f1f52f980db36080bfd6fbbbd01f7f9a5d0466cb"
            "67a346fe9b00c4688bb1c874365309a530352c48"
            "6f997f1fdcb240884ed0f7a9b2f09c750faa47fe"
            "f0ce8af271a15197ab188685001b54bb1f59a1aa"
          )
          readonly forbidden_versions=(
            "20260809120000"
            "20260809130000"
            "20260809140000"
            "20260809150000"
            "20260809160000"
            "20260810000000"
            "20260810010000"
            "20260810020000"
            "20260810030000"
          )

          for index in "${!expected_files[@]}"; do
            file="${expected_files[$index]}"
            [[ -f "supabase/migrations/$file" ]] || {
              echo "RELEASE_IDENTITY_CHANGED: reviewed migration file is missing."
              exit 1
            }
            if [[ "$(git hash-object "supabase/migrations/$file")" != "${expected_blob_hashes[$index]}" ]]; then
              echo "RELEASE_IDENTITY_CHANGED: reviewed migration content differs from the approved release."
              exit 1
            fi
          done

          for version in "${forbidden_versions[@]}"; do
            if compgen -G "supabase/migrations/${version}_*.sql" > /dev/null; then
              echo "RELEASE_IDENTITY_CHANGED: frozen PR #2 migration is present."
              exit 1
            fi
          done

      - name: Link the fixed production project
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install supabase link --project-ref "$PROJECT_REF" --yes

      - name: Preflight the official migration history
        shell: bash
        run: |
          set -euo pipefail
          history_json="$(npx --no-install supabase migration list --linked --output-format json)"
          printf '%s\n' "$history_json" > "$RUNNER_TEMP/pr19-migrations-before.json"
          mapfile -t remote_versions < <(
            jq -r '.migrations[] | (.remote // empty)' "$RUNNER_TEMP/pr19-migrations-before.json" \
              | grep -E '^[0-9]{14}$' \
              | sort -u
          )
          readonly forbidden_versions=(
            "20260809120000"
            "20260809130000"
            "20260809140000"
            "20260809150000"
            "20260809160000"
            "20260810000000"
            "20260810010000"
            "20260810020000"
            "20260810030000"
          )

          for version in "${forbidden_versions[@]}"; do
            if printf '%s\n' "${remote_versions[@]}" | grep -Fxq "$version"; then
              echo "MIGRATION_ALLOWLIST_MISMATCH: frozen PR #2 migration is already applied remotely."
              exit 1
            fi
          done

          echo "Production migration versions observed before push:"
          printf '%s\n' "${remote_versions[@]}"

      - name: Dry-run and assert the exact reviewed pending set
        shell: bash
        run: |
          set -euo pipefail
          readonly expected_versions=(
            "20260811230000"
            "20260812000000"
            "20260812010000"
            "20260812022922"
            "20260812030000"
          )
          readonly forbidden_versions=(
            "20260809120000"
            "20260809130000"
            "20260809140000"
            "20260809150000"
            "20260809160000"
            "20260810000000"
            "20260810010000"
            "20260810020000"
            "20260810030000"
          )

          dry_run="$(npx --no-install supabase db push --linked --dry-run 2>&1)" || {
            printf '%s\n' "$dry_run"
            exit 1
          }
          printf '%s\n' "$dry_run" > "$RUNNER_TEMP/pr19-migrations-dry-run.txt"

          mapfile -t pending_versions < <(
            grep -oE '20[0-9]{12}' "$RUNNER_TEMP/pr19-migrations-dry-run.txt"
          )

          if [[ "${#pending_versions[@]}" -ne "${#expected_versions[@]}" ]]; then
            echo "MIGRATION_ALLOWLIST_MISMATCH: unexpected pending migration count."
            exit 1
          fi

          for index in "${!expected_versions[@]}"; do
            if [[ "${pending_versions[$index]}" != "${expected_versions[$index]}" ]]; then
              echo "MIGRATION_ALLOWLIST_MISMATCH: pending migrations differ from the reviewed ordered set."
              exit 1
            fi
          done

          for version in "${forbidden_versions[@]}"; do
            if printf '%s\n' "${pending_versions[@]}" | grep -Fxq "$version"; then
              echo "MIGRATION_ALLOWLIST_MISMATCH: a frozen PR #2 migration was offered."
              exit 1
            fi
          done

          printf '%s\n' "${pending_versions[@]}" > "$RUNNER_TEMP/pr19-approved-pending-versions.txt"
          echo "Dry-run allowlist: EXACT FIVE / PASS"

      - name: Apply the exact reviewed pending migrations
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install supabase db push --linked

      - name: Verify the applied migration history
        shell: bash
        run: |
          set -euo pipefail
          readonly expected_versions=(
            "20260811230000"
            "20260812000000"
            "20260812010000"
            "20260812022922"
            "20260812030000"
          )
          readonly forbidden_versions=(
            "20260809120000"
            "20260809130000"
            "20260809140000"
            "20260809150000"
            "20260809160000"
            "20260810000000"
            "20260810010000"
            "20260810020000"
            "20260810030000"
          )

          history_json="$(npx --no-install supabase migration list --linked --output-format json)"
          printf '%s\n' "$history_json" > "$RUNNER_TEMP/pr19-migrations-after.json"
          mapfile -t remote_versions < <(
            jq -r '.migrations[] | (.remote // empty)' "$RUNNER_TEMP/pr19-migrations-after.json" \
              | grep -E '^[0-9]{14}$' \
              | sort -u
          )

          for version in "${expected_versions[@]}"; do
            if ! printf '%s\n' "${remote_versions[@]}" | grep -Fxq "$version"; then
              echo "POST_PUSH_MIGRATION_VERIFICATION_FAILED: a reviewed migration is missing remotely."
              exit 1
            fi
          done

          for version in "${forbidden_versions[@]}"; do
            if printf '%s\n' "${remote_versions[@]}" | grep -Fxq "$version"; then
              echo "POST_PUSH_MIGRATION_VERIFICATION_FAILED: frozen PR #2 migration is remotely applied."
              exit 1
            fi
          done

          echo "Production migration versions verified after push:"
          printf '%s\n' "${expected_versions[@]}"
