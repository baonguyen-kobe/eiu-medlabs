name: Personnel Production Permission Smoke 2026-08-10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow ref
        uses: actions/checkout@v4

      - name: Verify required Personnel smoke credentials
        env:
          PRODUCTION_ADMIN_IDENTIFIER: ${{ secrets.PRODUCTION_ADMIN_IDENTIFIER }}
          PRODUCTION_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
          PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER: ${{ secrets.PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER }}
          PRODUCTION_PERSONNEL_MANAGER_PASSWORD: ${{ secrets.PRODUCTION_PERSONNEL_MANAGER_PASSWORD }}
          PRODUCTION_ORDINARY_ADMIN_IDENTIFIER: ${{ secrets.PRODUCTION_ORDINARY_ADMIN_IDENTIFIER }}
          PRODUCTION_ORDINARY_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ORDINARY_ADMIN_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for variable in \
            PRODUCTION_ADMIN_IDENTIFIER \
            PRODUCTION_ADMIN_PASSWORD \
            PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER \
            PRODUCTION_PERSONNEL_MANAGER_PASSWORD \
            PRODUCTION_ORDINARY_ADMIN_IDENTIFIER \
            PRODUCTION_ORDINARY_ADMIN_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              missing+=("$variable")
            fi
          done
          if ((${#missing[@]})); then
            printf '::error::Missing required GitHub Actions secret(s): %s\\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Personnel permission smoke
        env:
          PRODUCTION_BASE_URL: https://medlabs-calendar.vercel.app
          PRODUCTION_ADMIN_IDENTIFIER: ${{ secrets.PRODUCTION_ADMIN_IDENTIFIER }}
          PRODUCTION_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
          PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER: ${{ secrets.PRODUCTION_PERSONNEL_MANAGER_IDENTIFIER }}
          PRODUCTION_PERSONNEL_MANAGER_PASSWORD: ${{ secrets.PRODUCTION_PERSONNEL_MANAGER_PASSWORD }}
          PRODUCTION_ORDINARY_ADMIN_IDENTIFIER: ${{ secrets.PRODUCTION_ORDINARY_ADMIN_IDENTIFIER }}
          PRODUCTION_ORDINARY_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ORDINARY_ADMIN_PASSWORD }}
        run: npx playwright test tests/e2e/production-personnel-permissions.spec.ts
